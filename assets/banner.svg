<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Plainspoken. Plain answers. Less repetition.</title>
  <desc id="desc">The deadpan speech bubble beside a bold lowercase Plainspoken wordmark on a pale violet background.</desc>
  <rect width="1200" height="400" rx="24" fill="#EAE5FA"/>
  <g transform="translate(96 54) scale(1.65)">
    <path d="M28 27 H135 Q156 27 156 48 V108 Q156 129 135 129 H79 L47 152 V129 H28 Q7 129 7 108 V48 Q7 27 28 27Z" fill="#FFFDF7" stroke="#242524" stroke-width="7" stroke-linejoin="round"/>
    <g fill="#242524">
      <circle cx="58" cy="70" r="4.5"/>
      <circle cx="106" cy="70" r="4.5"/>
    </g>
    <path d="M59 99 H105" stroke="#242524" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#242524">
    <text x="420" y="78" font-size="13" font-weight="700" letter-spacing="2.5">A RESPONSE-STYLE PLUGIN</text>
    <g font-size="94" font-weight="700" letter-spacing="-5">
      <text x="414" y="171">plain</text>
      <text x="414" y="261">spoken.</text>
    </g>
    <text x="420" y="313" font-size="24">Plain answers. Less repetition.</text>
    <path d="M64 352 H1136" stroke="#242524" stroke-opacity=".16"/>
    <text x="64" y="379" font-size="12" letter-spacing="1.5">CODEX / CLAUDE CODE / CURSOR</text>
    <text x="1136" y="379" text-anchor="end" font-size="12" letter-spacing="1.5">ENOUGH SAID.</text>
  </g>
</svg>
