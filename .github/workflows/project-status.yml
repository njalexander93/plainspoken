name: Project Status

# Issue lifecycle on the GitHub Project, keyed by the issue-<n> branch convention
# in .github/scripts/project-status.sh. Post-merge Staging/Done and Released
# transitions belong to other workflows that reuse the same script.
on:
  create:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, closed]

permissions: {}

# Events for one branch run in order, never cancelled, so none is lost.
concurrency:
  group: project-status-${{ github.event.pull_request.head.ref || github.event.ref }}
  cancel-in-progress: false

jobs:
  status:
    # A new branch, a PR opened or reopened against main, or a PR actually merged.
    if: >-
      (github.event_name == 'create' && github.event.ref_type == 'branch') ||
      (github.event_name == 'pull_request_target' &&
        (github.event.action != 'closed' || github.event.pull_request.merged))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      BRANCH: ${{ github.event.pull_request.head.ref || github.event.ref }}
      TARGET: >-
        ${{ github.event_name == 'create' && 'In Progress'
            || github.event.action == 'closed' && 'Merged'
            || 'In Review' }}
    steps:
      # Only the default branch is checked out: PR code never runs with the project token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: bash .github/scripts/project-status.sh "$BRANCH" "$TARGET"
