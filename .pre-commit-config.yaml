minimum_pre_commit_version: '4.6.2'
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format check (staged Python)
        language: unsupported
        entry: poetry run ruff format --check --no-cache
        files: ^(scripts|tests)/
        types_or: [python, pyi]
      - id: ruff-lint
        name: Ruff lint (staged Python)
        language: unsupported
        entry: poetry run ruff check --no-fix --no-cache
        files: ^(scripts|tests)/
        types_or: [python, pyi]
      - id: mypy
        name: Mypy (configured production scope)
        language: unsupported
        entry: poetry run mypy
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Pytest (shared suite plus this OS's tests, no coverage)
        language: unsupported
        entry: poetry run pytest -q
        pass_filenames: false
        always_run: true
