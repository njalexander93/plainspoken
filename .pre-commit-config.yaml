minimum_pre_commit_version: '4.6.2'
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format check (staged Python)
        language: unsupported
        entry: poetry run ruff format --check --no-cache
        files: ^(scripts|tests)/
        types_or: [python, pyi]
      - id: ruff-lint
        name: Ruff lint (staged Python)
        language: unsupported
        entry: poetry run ruff check --no-fix --no-cache
        files: ^(scripts|tests)/
        types_or: [python, pyi]
      - id: mypy
        name: Mypy (configured production scope)
        language: unsupported
        entry: poetry run mypy
        pass_filenames: false
        always_run: true
      - id: unit-tests
        name: Unit tests (no coverage)
        language: unsupported
        entry: poetry run pytest -q tests/unit
        pass_filenames: false
        always_run: true
      - id: integration-tests
        name: Integration tests for this OS (no coverage)
        language: unsupported
        entry: poetry run pytest -q tests/integration
        pass_filenames: false
        always_run: true
